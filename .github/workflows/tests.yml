name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install CPU-only PyTorch
        # GitHub runners have no GPU; the CUDA wheel is ~2.5GB vs ~200MB.
        # Installed before requirements-ci.txt so sentence-transformers
        # resolves against this build instead of pulling the CUDA one.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run tests
        run: pytest -v